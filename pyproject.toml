
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"


[project]
name = 'flask-quickstart'
description = 'A quick start for commonly used features of a Flask app'
version = '1.1.1'
authors = [
    { name='Fictive Kin LLC', email='hello@fictivekin.com' },
]
classifiers = [
    'Development Status :: 4 - Beta',
    'Framework :: Flask',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Topic :: Software Development',
]
readme = "README.md"
license = 'MIT'
license-files = ["LICEN[CS]E*"]
requires-python = ">=3.10"
dependencies = [
    'boto3',
    'botocore',
    'dynaconf>=3.2',
    'flask>=3.0',
    'werkzeug>=3.0',
]

[project.optional-dependencies]
sentry = ['sentry-sdk[flask]>=2.0']
# Not the `flask-csp` on PyPI, which is an unrelated project
csp = ['flask-csp @ git+https://github.com/fictive-kin/flask-csp.git@v1.1.1']
cors = ['flask-cors>=6.0.0']
full = [
    'flask-csp @ git+https://github.com/fictive-kin/flask-csp.git@v1.1.1',
    'flask-cors>=6.0.0',
    'sentry-sdk[flask]>=2.0',
]
tests = [
    'flask-quickstart[full]',
    'pytest',
    'pytest-randomly',
]
lint = [
    'ruff>=0.17',
]

[project.urls]
Homepage = 'https://github.com/jnhmcknight/flask-quickstart'

[tool.setuptools.packages.find]
include = ['flask_quickstart*']

[tool.pytest.ini_options]
testpaths = ['tests']

[tool.ruff.lint]
extend-select = [
    'B',   # flake8-bugbear
    'I',   # isort
    'UP',  # pyupgrade
    'W',   # pycodestyle warnings
]
ignore = [
    'TRY004',  # ValueError is part of the public API for invalid values
]

[tool.ruff.lint.per-file-ignores]
# Re-exported names
'__init__.py' = ['F401']

[tool.ruff.lint.isort]
known-first-party = ['flask_quickstart']
